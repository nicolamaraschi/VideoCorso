version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - cd backend
      - pip install -r tests/requirements-test.txt
  build:
    commands:
      - echo "Running E2E API availability tests..."
      - cd backend
      - python -m pytest tests/test_api_availability.py -v --tb=short
