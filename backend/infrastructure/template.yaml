AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: VideoCorso Platform - Complete Serverless Backend

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Environment name
  AllowedCheckoutOrigins:
    Type: String
    Description: Application origin permitted for Stripe redirects and browser API calls (for example https://academy.example.it)
  ResendTestRecipients:
    Type: String
    Default: ""
    Description: Comma-separated pre-live test recipients; empty disables Resend delivery.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        COURSES_TABLE: !Ref CoursesTable
        CHAPTERS_TABLE: !Ref ChaptersTable
        LESSONS_TABLE: !Ref LessonsTable
        PURCHASES_TABLE: !Ref PurchasesTable
        COUPONS_TABLE: !Ref CouponsTable
        WEBHOOK_EVENTS_TABLE: !Ref WebhookEventsTable
        CHECKOUT_REQUESTS_TABLE: !Ref CheckoutRequestsTable
        COUPON_RESERVATIONS_TABLE: !Ref CouponReservationsTable
        PROVISIONING_OUTBOX_TABLE: !Ref ProvisioningOutboxTable
        AUDIT_LOGS_TABLE: !Ref AuditLogsTable
        PROGRESS_TABLE: !Ref ProgressTable
        USERS_TABLE: !Ref UsersTable
        VIDEO_BUCKET: !Ref VideoBucket
        THUMBNAIL_BUCKET: !Ref ThumbnailBucket
        # Secret values live in SSM Parameter Store, never in CloudFormation parameters.
        # See docs/OPERATIONS.md for the production paths and rotation procedure.
        STRIPE_SECRET_KEY_PARAMETER: !Sub "/videocorso/${Environment}/stripe/secret-key"
        STRIPE_WEBHOOK_SECRET_PARAMETER: !Sub "/videocorso/${Environment}/stripe/webhook-secret"
        RESEND_API_KEY_PARAMETER: !Sub "/videocorso/${Environment}/resend/api-key"
        RESEND_TEST_RECIPIENTS: !Ref ResendTestRecipients
        ALLOWED_CHECKOUT_ORIGINS: !Ref AllowedCheckoutOrigins
        # FIX: Aggiunta variabile d'ambiente globale per Cognito
        COGNITO_USER_POOL_ID: !Ref UserPool

Resources:
  # ==================== DynamoDB Tables ====================

  CoursesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-courses"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: course_id
          AttributeType: S
      KeySchema:
        - AttributeName: course_id
          KeyType: HASH

  ChaptersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-chapters"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: chapter_id
          AttributeType: S
        - AttributeName: course_id
          AttributeType: S
      KeySchema:
        - AttributeName: chapter_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CourseIndex
          KeySchema:
            - AttributeName: course_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  LessonsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-lessons"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: lesson_id
          AttributeType: S
        - AttributeName: chapter_id
          AttributeType: S
      KeySchema:
        - AttributeName: lesson_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ChapterIndex
          KeySchema:
            - AttributeName: chapter_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PurchasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-purchases"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: purchase_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: purchase_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CouponsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-coupons"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: coupon_id
          AttributeType: S
      KeySchema:
        - AttributeName: coupon_id
          KeyType: HASH

  WebhookEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-webhook-events"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl_expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

  CheckoutRequestsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-checkout-requests"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl_expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: checkout_request_id
          AttributeType: S
      KeySchema:
        - AttributeName: checkout_request_id
          KeyType: HASH

  ProvisioningOutboxTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-provisioning-outbox"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: ttl_expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: outbox_id
          AttributeType: S
      KeySchema:
        - AttributeName: outbox_id
          KeyType: HASH

  CouponReservationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-coupon-reservations"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl_expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: reservation_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: expires_at_epoch
          AttributeType: N
      KeySchema:
        - AttributeName: reservation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusExpiryIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: expires_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-progress"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: progress_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: lesson_id
          AttributeType: S
      KeySchema:
        - AttributeName: progress_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: LessonIndex
          KeySchema:
            - AttributeName: lesson_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-users"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-videocorso-audit-logs"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: audit_id
          AttributeType: S
      KeySchema:
        - AttributeName: audit_id
          KeyType: HASH

  # ==================== S3 Buckets ====================

  VideoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${Environment}-videocorso-content"
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - "*"
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ThumbnailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${Environment}-videocorso-thumbnails"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false

  ThumbnailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ThumbnailBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${ThumbnailBucket.Arn}/*"

  # ==================== Cognito User Pool ====================

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${Environment}-videocorso-users"
      AdminCreateUserConfig:
        UnusedAccountValidityDays: 365
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
        - Name: full_name
          AttributeDataType: String
          Mutable: true
        - Name: subscription_status
          AttributeDataType: String
          Mutable: true
        - Name: sub_end_date
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${Environment}-videocorso-web-client"
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: LEGACY

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Administrator group

  StudentsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: students
      UserPoolId: !Ref UserPool
      Description: Students group

  # ==================== API Gateway ====================

  ApiGateway:
    Type: AWS::Serverless::Api
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${Environment}-videocorso-api"
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedCheckoutOrigins}'"
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
        DefaultAuthorizer: CognitoAuthorizer

  # ==================== Lambda Functions ====================

  # Shared layer containing the centralised purchase_access module.
  # All five handlers that need access-control logic import from here,
  # ensuring a single source of truth and eliminating copy-paste divergence.
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${Environment}-videocorso-shared"
      Description: "Shared purchase_access, sync_purchase_access and related utilities"
      ContentUri: ../layers/shared/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete

  PaymentHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-videocorso-payment-handler"
      CodeUri: ../lambda/payment_handler/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CoursesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PurchasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WebhookEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CheckoutRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponReservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProvisioningOutboxTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt PurchasesTable.Arn
                - !GetAtt CouponsTable.Arn
                - !GetAtt WebhookEventsTable.Arn
                - !GetAtt CheckoutRequestsTable.Arn
                - !GetAtt CouponReservationsTable.Arn
                - !GetAtt ProvisioningOutboxTable.Arn
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/videocorso/${Environment}/*"
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        CreateCheckout:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /payment/create-checkout
            Method: POST
            Auth:
              Authorizer: NONE
        QuoteCheckout:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /payment/quote
            Method: POST
            Auth:
              Authorizer: NONE
        StripeWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /payment/webhook
            Method: POST
            Auth:
              Authorizer: NONE
        VerifyPayment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /payment/verify/{sessionId}
            Method: GET
            Auth:
              Authorizer: NONE

  CourseHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-videocorso-course-handler"
      CodeUri: ../lambda/course_handler/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CoursesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChaptersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LessonsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PurchasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        GetCourseStructure:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /course/structure
            Method: GET
        GetFreePreviews:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /course/previews
            Method: GET
            Auth:
              Authorizer: NONE
        GetCoursesCatalog:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /courses
            Method: GET
            Auth:
              Authorizer: NONE
        GetCourseById:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /courses/{courseId}
            Method: GET
        GetMyCourses:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /me/courses
            Method: GET

  VideoHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-videocorso-video-handler"
      CodeUri: ../lambda/video_handler/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref VideoBucket
        - DynamoDBReadPolicy:
            TableName: !Ref LessonsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ChaptersTable
        - DynamoDBReadPolicy:
            TableName: !Ref PurchasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        GetVideoUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /course/video/{lesson_id}
            Method: GET

  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-videocorso-mediaconvert"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadSourceWriteOptimizedVideo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt VideoBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${VideoBucket.Arn}/videos/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${VideoBucket.Arn}/streaming/*"

  VideoTranscodeHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-videocorso-video-transcode"
      CodeUri: ../lambda/video_transcode_handler/
      Handler: app.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          MEDIACONVERT_ROLE_ARN: !GetAtt MediaConvertRole.Arn
          LESSONS_TABLE: !Ref LessonsTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VideoBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref LessonsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - mediaconvert:DescribeEndpoints
                - mediaconvert:CreateJob
                - mediaconvert:CancelJob
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt MediaConvertRole.Arn

  VideoUploadTranscodeRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Avvia la conversione HD per i video sorgente caricati in VideoCorso
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref VideoBucket
          object:
            key:
              - prefix: videos/
      State: ENABLED
      Targets:
        - Arn: !GetAtt VideoTranscodeHandler.Arn
          Id: VideoTranscodeHandler
          DeadLetterConfig:
            Arn: !GetAtt VideoTranscodeEventDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 3

  AllowEventBridgeInvokeVideoTranscode:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VideoTranscodeHandler
      Principal: events.amazonaws.com
      SourceArn: !GetAtt VideoUploadTranscodeRule.Arn

  ProvisioningOutboxHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-videocorso-provisioning-outbox"
      CodeUri: ../lambda/provisioning_outbox_handler/
      Handler: app.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProvisioningOutboxDlq.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref ProvisioningOutboxTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PurchasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        ProvisioningOutboxStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ProvisioningOutboxTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 1
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 86400
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt ProvisioningOutboxDlq.Arn

  ProvisioningOutboxDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${Environment}-videocorso-provisioning-outbox-dlq"
      MessageRetentionPeriod: 1209600

  CouponReservationRecoveryHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-videocorso-coupon-reservation-recovery"
      CodeUri: ../lambda/coupon_reservation_recovery_handler/
      Handler: app.lambda_handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CouponReservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource:
                - !GetAtt CouponReservationsTable.Arn
                - !GetAtt CouponsTable.Arn

  CouponReservationRecoverySchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt CouponReservationRecoveryHandler.Arn
          Id: CouponReservationRecovery
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3

  AllowEventBridgeInvokeCouponReservationRecovery:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CouponReservationRecoveryHandler
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CouponReservationRecoverySchedule.Arn

  VideoTranscodeEventDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${Environment}-videocorso-transcode-event-dlq"
      MessageRetentionPeriod: 1209600

  VideoTranscodeEventDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref VideoTranscodeEventDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt VideoTranscodeEventDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt VideoUploadTranscodeRule.Arn
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt VideoTranscodeEventDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt MediaConvertCompletionRule.Arn

  MediaConvertCompletionRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Verifica la versione attiva quando un job MediaConvert termina
      EventPattern:
        source:
          - aws.mediaconvert
        detail-type:
          - MediaConvert Job State Change
        detail:
          status:
            - COMPLETE
            - ERROR
            - CANCELED
      State: ENABLED
      Targets:
        - Arn: !GetAtt VideoTranscodeHandler.Arn
          Id: VideoTranscodeCompletion
          DeadLetterConfig:
            Arn: !GetAtt VideoTranscodeEventDlq.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 3

  AllowMediaConvertCompletionInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VideoTranscodeHandler
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MediaConvertCompletionRule.Arn

  ProvisioningOutboxDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Provisioning outbox records requiring manual recovery
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProvisioningOutboxDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  VideoTranscodeEventDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Video transcode EventBridge deliveries requiring manual recovery
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt VideoTranscodeEventDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

